<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Florida DJJ Headset Pickup</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{
    --ink:#1B1F23;
    --paper:#F5F3EF;
    --card:#FFFFFF;
    --line:#E4E0D8;
    --muted:#6B6559;
    --leg1:#2E5C8A;
    --leg2:#2E7D5C;
    --leg3:#9A6B1F;
    --leg4:#8A2E4A;
    --done:#2E7D5C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:48px;
  }
  header{
    position:sticky;
    top:0;
    z-index:20;
    background:var(--ink);
    color:#fff;
    padding:14px 16px 12px;
  }
  header h1{
    margin:0 0 2px;
    font-size:19px;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  header p{
    margin:0;
    font-size:12.5px;
    color:#C9C4B8;
    line-height:1.4;
  }
  .progress-wrap{
    margin-top:10px;
  }
  .progress-track{
    height:6px;
    background:rgba(255,255,255,0.18);
    border-radius:99px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:#8FD3B0;
    width:0%;
    transition:width .35s ease;
  }
  .progress-label{
    margin-top:5px;
    font-size:11.5px;
    color:#C9C4B8;
    font-variant-numeric:tabular-nums;
  }
  main{
    max-width:640px;
    margin:0 auto;
    padding:14px 12px 0;
  }
  details.leg{
    background:transparent;
    margin-bottom:14px;
  }
  summary.leg-head{
    list-style:none;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:9px;
    padding:10px 12px;
    border-radius:10px;
    color:#fff;
    font-weight:700;
    font-size:13.5px;
    letter-spacing:0.01em;
  }
  summary.leg-head::-webkit-details-marker{display:none;}
  summary.leg-head .chev{
    margin-left:auto;
    font-size:11px;
    opacity:0.85;
    transition:transform .2s ease;
  }
  details[open] summary.leg-head .chev{transform:rotate(90deg);}
  .leg1 summary.leg-head{background:var(--leg1);}
  .leg2 summary.leg-head{background:var(--leg2);}
  .leg3 summary.leg-head{background:var(--leg3);}
  .leg4 summary.leg-head{background:var(--leg4);}
  .leg-sub{
    font-weight:500;
    font-size:11.5px;
    opacity:0.85;
  }
  .stops{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-top:9px;
  }
  .stop{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:11px 12px;
    display:flex;
    gap:10px;
    align-items:flex-start;
    transition:opacity .2s ease, background .2s ease;
  }
  .stop.done{
    opacity:0.55;
  }
  .stop.done .name{
    text-decoration:line-through;
    text-decoration-color:var(--muted);
  }
  .num{
    flex:0 0 auto;
    width:24px;
    height:24px;
    border-radius:50%;
    background:var(--paper);
    color:var(--muted);
    font-size:11.5px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-top:1px;
  }
  .stop-body{flex:1;min-width:0;}
  .name{
    font-size:14.5px;
    font-weight:700;
    line-height:1.3;
    margin:0 0 1px;
  }
  .city{
    font-size:12.5px;
    color:var(--muted);
    margin:0 0 8px;
  }
  .actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size:12.5px;
    font-weight:600;
    text-decoration:none;
    padding:7px 11px;
    border-radius:8px;
    border:1px solid var(--line);
    color:var(--ink);
    background:#fff;
    white-space:nowrap;
  }
  .btn.call{
    background:var(--ink);
    color:#fff;
    border-color:var(--ink);
  }
  .btn svg{width:13px;height:13px;flex:0 0 auto;}
  .check{
    flex:0 0 auto;
    width:26px;
    height:26px;
    border-radius:7px;
    border:1.5px solid var(--line);
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    margin-top:1px;
    -webkit-tap-highlight-color:transparent;
  }
  .check.checked{
    background:var(--done);
    border-color:var(--done);
  }
  .check svg{width:15px;height:15px;stroke:#fff;display:none;}
  .check.checked svg{display:block;}
  address{
    font-style:normal;
  }
  .addr-text{
    font-size:11.5px;
    color:var(--muted);
    margin:0 0 8px;
    line-height:1.35;
  }
  footer{
    max-width:640px;
    margin:18px auto 0;
    padding:0 16px;
    font-size:11.5px;
    color:var(--muted);
    line-height:1.5;
  }
  .reset-btn{
    display:inline-block;
    margin-top:10px;
    font-size:12px;
    color:var(--muted);
    text-decoration:underline;
    background:none;
    border:none;
    padding:0;
    cursor:pointer;
  }
  .confetti-piece{
    position:fixed;
    top:-12px;
    width:8px;
    height:14px;
    opacity:0.9;
    pointer-events:none;
    z-index:999;
    animation:confetti-fall linear forwards;
  }
  @keyframes confetti-fall{
    to{
      transform:translateY(105vh) rotate(720deg);
      opacity:0.3;
    }
  }
  .nearest-btn{
    display:block;
    width:100%;
    margin-top:10px;
    background:#3A7CA5;
    color:#fff;
    border:none;
    border-radius:8px;
    padding:10px 12px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
  }
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(27,31,35,0.55);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    z-index:200;
  }
  .modal-overlay[hidden]{display:none;}
  .modal-panel{
    background:var(--paper);
    width:100%;
    max-width:640px;
    max-height:88vh;
    overflow-y:auto;
    border-radius:16px 16px 0 0;
    padding:14px 14px 18px;
  }
  @media (min-width:680px){
    .modal-overlay{align-items:center; padding:20px;}
    .modal-panel{border-radius:16px;}
  }
  .modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:8px;
  }
  .modal-header h2{
    margin:0;
    font-size:16px;
  }
  .modal-close{
    background:none;
    border:none;
    font-size:20px;
    line-height:1;
    cursor:pointer;
    color:var(--muted);
    padding:4px;
  }
  .nearest-status{
    font-size:12.5px;
    color:var(--muted);
    margin-bottom:10px;
  }
  .nearest-map{
    height:220px;
    border-radius:10px;
    overflow:hidden;
    margin-bottom:12px;
    border:1px solid var(--line);
  }
  .distance-badge{
    font-weight:700;
    color:var(--leg1);
  }
  .notes-input{
    display:block;
    width:100%;
    font:inherit;
    font-size:12.5px;
    padding:6px 8px;
    border:1px solid var(--line);
    border-radius:8px;
    resize:vertical;
    margin:0 0 8px;
    background:#fff;
    color:var(--ink);
  }
  .notes-input:focus{
    outline:2px solid var(--leg1);
    outline-offset:1px;
  }
  .logo-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
  }
  .logo-badge{
    height:36px;
    width:auto;
    display:block;
    border-radius:6px;
  }
  .logo-transfr{
    background:#fff;
    padding:5px 8px;
  }
</style>
</head>
<body>

<header>
  <div class="logo-row">
    <img src="assets/fl-djj-logo.jpg" alt="Florida Department of Juvenile Justice" class="logo-badge logo-fldjj">
    <img src="assets/transfr-logo.png" alt="Transfr" class="logo-badge logo-transfr">
  </div>
  <h1>Florida DJJ Headset Pickup</h1>

<main id="main"></main>

<footer>
  Order: Panhandle (west→east on I-10) → Northeast → Central → South, each leg running north to south.

  <button class="reset-btn" id="resetBtn">Reset all checkmarks</button>
</footer>

<div class="modal-overlay" id="nearestOverlay" hidden>
  <div class="modal-panel">

const TOTAL = DATA.reduce((n, leg) => n + leg.stops.length, 0);
let callStatus = {};
let notesData = {};

function telHref(phone){
  return "tel:" + phone.replace(/[^\d]/g, "");
}
function mapsHref(addr){
  return "https://maps.google.com/?q=" + encodeURIComponent(addr);
}
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

function createStopElement(id, name, city, phone, addr, idPrefix, extraHtml){
  const stopEl = document.createElement("div");
  stopEl.className = "stop";
  stopEl.dataset.id = id;
  stopEl.id = idPrefix + id;

  stopEl.innerHTML = `
    <div class="num">${id}</div>
    <div class="stop-body">
      <p class="name">${name}</p>
      <p class="city">${city}${extraHtml || ""}</p>
      <p class="addr-text">${addr}</p>
      <textarea class="notes-input" data-id="${id}" placeholder="Notes (optional)" rows="2">${escapeHtml(notesData[id] || "")}</textarea>
      <div class="actions">
        <a class="btn call" href="${telHref(phone)}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          ${phone}
        </a>
        <a class="btn" href="${mapsHref(addr)}" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          Directions
        </a>
      </div>
    </div>
    <div class="check" data-id="${id}">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
  `;
  return stopEl;
}

function render(){
  const main = document.getElementById("main");
  main.innerHTML = "";
  let counter = 0;
  DATA.forEach(leg => {
    const details = document.createElement("details");
    details.className = "leg leg" + leg.leg;
    details.open = false;

    const summary = document.createElement("summary");
    summary.className = "leg-head";
    summary.innerHTML = `<span>${leg.name}</span><span class="leg-sub">${leg.sub}</span><span class="chev">▶</span>`;
    details.appendChild(summary);

    const stopsWrap = document.createElement("div");
    stopsWrap.className = "stops";

    leg.stops.forEach(([name, city, phone, addr]) => {
      counter++;
      const id = String(counter);
      stopsWrap.appendChild(createStopElement(id, name, city, phone, addr, "stop-"));
    });

    details.appendChild(stopsWrap);
    main.appendChild(details);
  });

  applyStatus();
}

document.addEventListener("click", e => {
  const checkEl = e.target.closest(".check");
  if(checkEl) toggleStop(checkEl.dataset.id, checkEl);
});

function setCheckedUI(id, checked){
  document.querySelectorAll(`.check[data-id="${id}"]`).forEach(el => el.classList.toggle("checked", checked));
  document.querySelectorAll(`.stop[data-id="${id}"]`).forEach(el => el.classList.toggle("done", checked));
}

function applyStatus(){
  let doneCount = 0;
  Object.keys(callStatus).forEach(id => {
    if(!callStatus[id]) return;
    doneCount++;
    setCheckedUI(id, true);
  });
  const pct = Math.round((doneCount / TOTAL) * 100);
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressLabel").textContent = `${doneCount} of ${TOTAL} called`;
}

function cacheStatusLocally(){
  try{
    localStorage.setItem("djj-call-status", JSON.stringify(callStatus));
  }catch(e){
    console.error("Could not cache progress locally:", e);
  }
}

function loadCachedStatus(){
  try{
    const raw = localStorage.getItem("djj-call-status");
    return raw ? JSON.parse(raw) : {};
  }catch(e){
    return {};
  }
}

function cacheNotesLocally(){
  try{
    localStorage.setItem("djj-call-notes", JSON.stringify(notesData));
  }catch(e){
    console.error("Could not cache notes locally:", e);
  }
}

function loadCachedNotes(){
  try{
    const raw = localStorage.getItem("djj-call-notes");
    return raw ? JSON.parse(raw) : {};
  }catch(e){
    return {};
  }
}

function setNotesUI(id, notes){
  document.querySelectorAll(`.notes-input[data-id="${id}"]`).forEach(el => {
    if(document.activeElement !== el) el.value = notes;
  });
}

async function loadStatus(){
  callStatus = loadCachedStatus();
  notesData = loadCachedNotes();
  try{
    const { data, error } = await sb.from("stop_status").select("id, checked, notes");
    if(error) throw error;
    callStatus = {};
    notesData = {};
    data.forEach(row => {
      callStatus[row.id] = row.checked;
      notesData[row.id] = row.notes || "";
    });
    cacheStatusLocally();
    cacheNotesLocally();
  }catch(e){
    console.error("Could not load shared progress, using local cache:", e);
  }
}

function applyRemoteChange(id, checked){
  callStatus[id] = checked;
  setCheckedUI(id, checked);
  applyStatus();
  cacheStatusLocally();
}

function applyRemoteNotes(id, notes){
  notesData[id] = notes || "";
  setNotesUI(id, notesData[id]);
  cacheNotesLocally();
}

function subscribeToChanges(){
  sb.channel("stop_status_changes")
    .on("postgres_changes", { event: "*", schema: "public", table: "stop_status" }, payload => {
      const row = payload.new;
      if(!row || row.id === undefined) return;
      if(row.checked !== undefined) applyRemoteChange(row.id, row.checked);
      if(row.notes !== undefined) applyRemoteNotes(row.id, row.notes);
    })
    .subscribe();
}

const notesSaveTimers = {};

async function saveNotesToServer(id){
  try{
    const { error } = await sb.from("stop_status").upsert({ id, notes: notesData[id] || "" });
    if(error) throw error;
  }catch(e){
    console.error("Could not save notes to server:", e);
  }
}

document.addEventListener("input", e => {
  const ta = e.target.closest(".notes-input");
  if(!ta) return;
  const id = ta.dataset.id;
  notesData[id] = ta.value;
  setNotesUI(id, ta.value);
  cacheNotesLocally();
  clearTimeout(notesSaveTimers[id]);
  notesSaveTimers[id] = setTimeout(() => saveNotesToServer(id), 700);
});

const CONFETTI_COLORS = ["#2E5C8A","#2E7D5C","#9A6B1F","#8A2E4A","#8FD3B0","#E4A93A"];

function launchConfetti(originX, originY){
  for(let i=0;i<36;i++){
    const piece = document.createElement("div");
    piece.className = "confetti-piece";
    piece.style.left = (originX + (Math.random()*140 - 70)) + "px";
    piece.style.top = originY + "px";
    piece.style.background = CONFETTI_COLORS[Math.floor(Math.random()*CONFETTI_COLORS.length)];
    piece.style.animationDuration = (0.9 + Math.random()*0.6) + "s";
    piece.style.animationDelay = (Math.random()*0.15) + "s";
    piece.style.transform = `rotate(${Math.random()*360}deg)`;
    piece.addEventListener("animationend", () => piece.remove());
    document.body.appendChild(piece);
  }
}

async function toggleStop(id, sourceEl){
  const checked = !callStatus[id];
  callStatus[id] = checked;
  setCheckedUI(id, checked);
  applyStatus();
  cacheStatusLocally();
  if(checked && sourceEl){
    const rect = sourceEl.getBoundingClientRect();
    launchConfetti(rect.left + rect.width / 2, rect.top);
  }
  try{
    const { error } = await sb.from("stop_status").upsert({ id, checked });
    if(error) throw error;
  }catch(e){
    console.error("Could not save progress to server:", e);
  }
}

const CITY_COORDS = {

function getAllStopsWithCoords(){
  const result = [];
  let counter = 0;
  DATA.forEach(leg => {
    leg.stops.forEach(([name, city, phone, addr]) => {
      counter++;
      const coords = CITY_COORDS[city];
      if(!coords) return;
      result.push({ id: String(counter), name, city, phone, addr, lat: coords[0], lng: coords[1] });
    });
  });
  return result;
}

function haversineMiles(lat1, lon1, lat2, lon2){
  const toRad = d => d * Math.PI / 180;
  const R = 3958.8;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

let nearestMap = null;
let nearestMarkers = null;

function ensureNearestMap(){
  if(!nearestMap){
    nearestMap = L.map("nearestMap");
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 18,
      attribution: "&copy; OpenStreetMap contributors"
    }).addTo(nearestMap);
    nearestMarkers = L.layerGroup().addTo(nearestMap);
  }
  return nearestMap;
}

function renderNearestMap(userLat, userLng, nearest){
  const map = ensureNearestMap();
  nearestMarkers.clearLayers();
  nearestMarkers.addLayer(
    L.circleMarker([userLat, userLng], { radius: 7, color: "#1B1F23", fillColor: "#1B1F23", fillOpacity: 1 }).bindPopup("You are here")
  );
  const bounds = [[userLat, userLng]];
  nearest.forEach(item => {
    nearestMarkers.addLayer(
      L.marker([item.lat, item.lng]).bindPopup(`<b>${item.name}</b><br>${item.city}<br>~${item.miles.toFixed(1)} mi`)
    );
    bounds.push([item.lat, item.lng]);
  });
  map.invalidateSize();
  map.fitBounds(bounds, { padding: [30, 30] });
}

function renderNearestList(nearest){
  const listEl = document.getElementById("nearestList");
  listEl.innerHTML = "";
  nearest.forEach(item => {
    const badge = ` <span class="distance-badge">~${item.miles.toFixed(1)} mi away</span>`;
    listEl.appendChild(createStopElement(item.id, item.name, item.city, item.phone, item.addr, "stop-near-", badge));
  });
  applyStatus();
}

document.getElementById("nearestBtn").addEventListener("click", () => {
  const overlay = document.getElementById("nearestOverlay");
  const statusEl = document.getElementById("nearestStatus");
  overlay.hidden = false;
  document.getElementById("nearestList").innerHTML = "";
  statusEl.textContent = "Finding your location…";

  if(!navigator.geolocation){
    statusEl.textContent = "Geolocation isn't supported in this browser.";
    return;
  }
  navigator.geolocation.getCurrentPosition(
    pos => {
      const { latitude, longitude } = pos.coords;
      const nearest = getAllStopsWithCoords()
        .map(s => ({ ...s, miles: haversineMiles(latitude, longitude, s.lat, s.lng) }))
        .sort((a, b) => a.miles - b.miles)
        .slice(0, 5);
      statusEl.textContent = "Showing the 5 closest facilities to your location.";
      renderNearestList(nearest);
      renderNearestMap(latitude, longitude, nearest);
    },
    err => {
      statusEl.textContent = "Couldn't get your location (" + err.message + "). Check your browser's location permission and try again.";
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
});

document.getElementById("nearestClose").addEventListener("click", () => {
  document.getElementById("nearestOverlay").hidden = true;
});

document.getElementById("nearestOverlay").addEventListener("click", e => {
  if(e.target.id === "nearestOverlay") e.currentTarget.hidden = true;
});

document.getElementById("resetBtn").addEventListener("click", async () => {
  callStatus = {};
  applyStatus();
  document.querySelectorAll(".check").forEach(el => el.classList.remove("checked"));
  document.querySelectorAll(".stop").forEach(el => el.classList.remove("done"));
  cacheStatusLocally();
  try{
    const { error } = await sb.from("stop_status").update({ checked: false }).neq("id", "");
    if(error) throw error;
  }catch(e){
    console.error("Could not reset shared progress:", e);
  }
});

(async function init(){
  await loadStatus();
  render();
  subscribeToChanges();
})();
</script>
